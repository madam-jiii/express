<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be Mine? ❤️</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
  <div class="hearts-bg" id="heartsBg"></div>

  <div class="proposal-container" data-aos="zoom-in" data-aos-duration="1000">
    <div class="gif-wrapper">
      <img id="proposalGif" class="proposal-gif" src="gifs/gif1.gif" alt="Romantic gif">
    </div>
    <h1 class="heading">Will You Be Mine? ❤️</h1>
    <div class="buttons">
      <button id="yesBtn" class="btn yes-btn">Yes ❤️</button>
      <button id="noBtn" class="btn no-btn">No 💔</button>
    </div>
  </div>

  <div class="modal-overlay" id="celebrationModal">
    <div class="modal-content celebration-content">
      <div class="confetti-container" id="confettiContainer"></div>
      <img id="celebrationGif" class="celebration-gif" src="gifs/gif6.gif" alt="Celebration">
      <h2 class="celebration-msg">Yayyy! I knew you'd say YES! ❤️</h2>
      <p class="countdown-text">Redirecting in <span id="countdown">5</span> seconds...</p>
    </div>
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="main.js"></script>
</body>
</html>
